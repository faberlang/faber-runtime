[package]
name = "faber-runtime"
version = "0.1.0"
edition = "2021"
description = "Faber language runtime types for generated Rust (crate name: faber)"
license = "MIT"
readme = "README.md"

[workspace]
members = ["hosts/llvm"]

[profile.dev]
debug = 1
codegen-units = 256

[profile.test]
debug = 1
codegen-units = 256

[features]
test-support = []

[lib]
name = "faber"
path = "src/lib.rs"

[dependencies]
ureq = "2"

[dev-dependencies]
radix-host-abi = { path = "../radix/crates/radix-host-abi" }
tempfile = "3"
